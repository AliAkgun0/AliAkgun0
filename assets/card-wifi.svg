<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 242" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B16" />
      <stop offset="100%" stop-color="#140B18" />
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  ]]></style>

  <rect x="3" y="3" width="574" height="236" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.3" />
  <rect x="3" y="3" width="574" height="236" rx="18" fill="url(#glow)" />
  <rect x="24" y="3" width="220" height="2.5" rx="1.25" fill="url(#accent)" />

  <!-- Icon Box -->
  <rect x="26" y="26" width="44" height="44" rx="12" fill="#280D19" stroke="#FB7185" stroke-opacity="0.45" stroke-width="1" />
  <path d="M48 36 L58 40 V48 C58 54 53.5 58.5 48 60 C42.5 58.5 38 54 38 48 V40 Z" fill="none" stroke="#FB7185" stroke-width="2" />

  <!-- Title & Subtitle -->
  <text x="84" y="45" class="sans" font-size="19" font-weight="800" fill="#F8FAFC">Wi-Fi Security Framework</text>
  <text x="84" y="64" class="mono" font-size="11.5" fill="#FB7185">AliAkgun0/wifi-security-framework</text>

  <!-- Status Pill -->
  <rect x="412" y="28" width="142" height="26" rx="13" fill="#280D19" stroke="#F43F5E" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="428" cy="41" r="3.5" fill="#FB7185">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="439" y="45" class="mono" font-size="10.5" font-weight="700" fill="#FDA4AF">★ KERNEL NETLINK</text>

  <!-- Description -->
  <text x="26" y="102" class="sans" font-size="13.5" fill="#CBD5E1">Enterprise wireless security framework in Python with zero external</text>
  <text x="26" y="123" class="sans" font-size="13.5" fill="#CBD5E1">shell wrappers. Direct Linux Netlink/nl80211 sockets, Scapy 802.11</text>
  <text x="26" y="144" class="sans" font-size="13.5" fill="#94A3B8">streaming, EAPOL handshake capture &amp; autonomous driver watchdog.</text>

  <line x1="26" y1="176" x2="554" y2="176" stroke="#1E293B" stroke-width="1" />

  <!-- Tech Chips -->
  <g transform="translate(26, 192)">
    <rect x="0" y="0" width="66" height="25" rx="7" fill="#130D1C" stroke="#1E293B" />
    <text x="33" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#FDA4AF">Python</text>

    <rect x="74" y="0" width="72" height="25" rx="7" fill="#130D1C" stroke="#1E293B" />
    <text x="110" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">nl80211</text>

    <rect x="154" y="0" width="76" height="25" rx="7" fill="#130D1C" stroke="#1E293B" />
    <text x="192" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">pyroute2</text>

    <rect x="238" y="0" width="60" height="25" rx="7" fill="#130D1C" stroke="#1E293B" />
    <text x="268" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#94A3B8">Scapy</text>

    <rect x="306" y="0" width="62" height="25" rx="7" fill="#130D1C" stroke="#1E293B" />
    <text x="337" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#94A3B8">EAPOL</text>
  </g>

  <text x="554" y="209" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#FB7185">Open Repo ↗</text>
</svg>
