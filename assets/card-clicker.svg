<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 242" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B16" />
      <stop offset="100%" stop-color="#071821" />
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  ]]></style>

  <rect x="3" y="3" width="574" height="236" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.3" />
  <rect x="3" y="3" width="574" height="236" rx="18" fill="url(#glow)" />
  <rect x="24" y="3" width="220" height="2.5" rx="1.25" fill="url(#accent)" />

  <!-- Icon Box -->
  <rect x="26" y="26" width="44" height="44" rx="12" fill="#082430" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1" />
  <path d="M42 37 L56 47 L49 49 L53 57 L49.5 58.5 L45.5 50.5 L41 55 Z" fill="none" stroke="#22D3EE" stroke-width="1.9" stroke-linejoin="round" />

  <!-- Title & Subtitle -->
  <text x="84" y="45" class="sans" font-size="19" font-weight="800" fill="#F8FAFC">PrecisionClicker Lite</text>
  <text x="84" y="64" class="mono" font-size="11.5" fill="#22D3EE">AliAkgun0/PrecisionClicker-Lite</text>

  <!-- Status Pill -->
  <rect x="424" y="28" width="130" height="26" rx="13" fill="#082430" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="440" cy="41" r="3.5" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="451" y="45" class="mono" font-size="10.5" font-weight="700" fill="#67E8F9">v1.0 RELEASE</text>

  <!-- Description -->
  <text x="26" y="102" class="sans" font-size="13.5" fill="#CBD5E1">Lightweight dark-themed desktop mouse automation GUI built for fast,</text>
  <text x="26" y="123" class="sans" font-size="13.5" fill="#CBD5E1">low-overhead workflows. Supports millisecond interval control, mouse</text>
  <text x="26" y="144" class="sans" font-size="13.5" fill="#94A3B8">button mapping &amp; global F6 hotkey toggling with standalone EXE build.</text>

  <line x1="26" y1="176" x2="554" y2="176" stroke="#1E293B" stroke-width="1" />

  <!-- Tech Chips -->
  <g transform="translate(26, 192)">
    <rect x="0" y="0" width="66" height="25" rx="7" fill="#091A24" stroke="#1E293B" />
    <text x="33" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#67E8F9">Python</text>

    <rect x="74" y="0" width="62" height="25" rx="7" fill="#091A24" stroke="#1E293B" />
    <text x="105" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">PyQt5</text>

    <rect x="144" y="0" width="84" height="25" rx="7" fill="#091A24" stroke="#1E293B" />
    <text x="186" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">PyAutoGUI</text>

    <rect x="236" y="0" width="90" height="25" rx="7" fill="#091A24" stroke="#1E293B" />
    <text x="281" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#94A3B8">Hotkeys GUI</text>
  </g>

  <text x="554" y="209" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#22D3EE">Open Repo ↗</text>
</svg>
