<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 242" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B16" />
      <stop offset="100%" stop-color="#071917" />
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  ]]></style>

  <rect x="3" y="3" width="574" height="236" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.3" />
  <rect x="3" y="3" width="574" height="236" rx="18" fill="url(#glow)" />
  <rect x="24" y="3" width="220" height="2.5" rx="1.25" fill="url(#accent)" />

  <!-- Icon Box -->
  <rect x="26" y="26" width="44" height="44" rx="12" fill="#07271F" stroke="#34D399" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="48" cy="49" r="10" fill="none" stroke="#34D399" stroke-width="2" />
  <path d="M48 44 V49 L52 52 M45 36 H51" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" />

  <!-- Title & Subtitle -->
  <text x="84" y="45" class="sans" font-size="19" font-weight="800" fill="#F8FAFC">FocusTime Pomodoro</text>
  <text x="84" y="64" class="mono" font-size="11.5" fill="#34D399">AliAkgun0/React-Pomodoro-Web</text>

  <!-- Status Pill -->
  <rect x="410" y="28" width="144" height="26" rx="13" fill="#07271F" stroke="#10B981" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="426" cy="41" r="3.5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="437" y="45" class="mono" font-size="10.5" font-weight="700" fill="#6EE7B7">SUPABASE CLOUD</text>

  <!-- Description -->
  <text x="26" y="102" class="sans" font-size="13.5" fill="#CBD5E1">Modern productivity timer featuring circular countdown rings, focus</text>
  <text x="26" y="123" class="sans" font-size="13.5" fill="#CBD5E1">statistics cards, desktop notifications, adaptive dark/light themes,</text>
  <text x="26" y="144" class="sans" font-size="13.5" fill="#94A3B8">and Supabase PostgreSQL cloud sync secured with Row Level Security.</text>

  <line x1="26" y1="176" x2="554" y2="176" stroke="#1E293B" stroke-width="1" />

  <!-- Tech Chips -->
  <g transform="translate(26, 192)">
    <rect x="0" y="0" width="74" height="25" rx="7" fill="#091B1B" stroke="#1E293B" />
    <text x="37" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#6EE7B7">React 18</text>

    <rect x="82" y="0" width="88" height="25" rx="7" fill="#091B1B" stroke="#1E293B" />
    <text x="126" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">TypeScript</text>

    <rect x="178" y="0" width="82" height="25" rx="7" fill="#091B1B" stroke="#1E293B" />
    <text x="219" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">Supabase</text>

    <rect x="268" y="0" width="88" height="25" rx="7" fill="#091B1B" stroke="#1E293B" />
    <text x="312" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#94A3B8">Postgres RLS</text>
  </g>

  <text x="554" y="209" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#34D399">Open Repo ↗</text>
</svg>
