<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 242" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B16" />
      <stop offset="100%" stop-color="#0B1426" />
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  ]]></style>

  <rect x="3" y="3" width="574" height="236" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.3" />
  <rect x="3" y="3" width="574" height="236" rx="18" fill="url(#glow)" />
  <rect x="24" y="3" width="220" height="2.5" rx="1.25" fill="url(#accent)" />

  <!-- Icon Box -->
  <rect x="26" y="26" width="44" height="44" rx="12" fill="#0B2239" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />
  <path d="M41 39 H55 M41 48 H55 M41 57 H50" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" />

  <!-- Title & Subtitle -->
  <text x="84" y="45" class="sans" font-size="19" font-weight="800" fill="#F8FAFC">GalaXako Editor</text>
  <text x="84" y="64" class="mono" font-size="11.5" fill="#38BDF8">AliAkgun0/gxeditor</text>

  <!-- Release Pill -->
  <rect x="424" y="28" width="130" height="26" rx="13" fill="#0A2239" stroke="#0EA5E9" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="440" cy="41" r="3.5" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="451" y="45" class="mono" font-size="10.5" font-weight="700" fill="#7DD3FC">v1.0.0 RELEASE</text>

  <!-- Description -->
  <text x="26" y="102" class="sans" font-size="13.5" fill="#CBD5E1">High-performance Windows desktop editor built for massive TXT, LOG,</text>
  <text x="26" y="123" class="sans" font-size="13.5" fill="#CBD5E1">CSV, TSV &amp; JSONL files without loading datasets into RAM. Streaming</text>
  <text x="26" y="144" class="sans" font-size="13.5" fill="#94A3B8">I/O, sparse indexing, disk-backed sorting, regex extract &amp; pipelines.</text>

  <line x1="26" y1="176" x2="554" y2="176" stroke="#1E293B" stroke-width="1" />

  <!-- Tech Chips -->
  <g transform="translate(26, 192)">
    <rect x="0" y="0" width="42" height="25" rx="7" fill="#0D182C" stroke="#1E293B" />
    <text x="21" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#7DD3FC">C#</text>

    <rect x="50" y="0" width="68" height="25" rx="7" fill="#0D182C" stroke="#1E293B" />
    <text x="84" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">.NET 10</text>

    <rect x="126" y="0" width="90" height="25" rx="7" fill="#0D182C" stroke="#1E293B" />
    <text x="171" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">WPF / MVVM</text>

    <rect x="224" y="0" width="106" height="25" rx="7" fill="#0D182C" stroke="#1E293B" />
    <text x="277" y="16.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#94A3B8">Streaming I/O</text>
  </g>

  <text x="554" y="209" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#38BDF8">Open Repo ↗</text>
</svg>
