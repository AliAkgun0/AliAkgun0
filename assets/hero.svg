<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0A1122" />
      <stop offset="100%" stop-color="#070C18" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.07" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="4" y="4" width="1192" height="402" rx="24" />
    </clipPath>
  </defs>

  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .cursor { animation: blink 1.15s infinite; }
    .live-dot { animation: pulseDot 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  ]]></style>

  <!-- Base Container -->
  <rect x="4" y="4" width="1192" height="402" rx="24" fill="url(#bgGrad)" />

  <g clip-path="url(#cardClip)">
    <!-- Architectural Grid -->
    <rect x="4" y="4" width="1192" height="402" fill="url(#gridPattern)" />

    <!-- Ambient Animated Aurora Orbs -->
    <circle cx="240" cy="110" r="260" fill="url(#orbCyan)">
      <animate attributeName="cx" values="220;290;220" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;145;100" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="960" cy="280" r="270" fill="url(#orbIndigo)">
      <animate attributeName="cx" values="980;910;980" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="290;230;290" dur="12s" repeatCount="indefinite" />
    </circle>

    <!-- Top OS Telemetry Header Bar -->
    <rect x="4" y="4" width="1192" height="48" fill="#04070F" fill-opacity="0.72" />
    <line x1="4" y1="52" x2="1196" y2="52" stroke="#1E293B" stroke-width="1" />

    <!-- Animated Top Laser Scan Beam -->
    <rect x="-340" y="4" width="340" height="2.5" fill="url(#laserBeam)">
      <animate attributeName="x" from="-340" to="1220" dur="5.2s" repeatCount="indefinite" />
    </rect>

    <!-- Window Controls -->
    <circle cx="34" cy="28" r="5.5" fill="#EF4444" fill-opacity="0.85" />
    <circle cx="54" cy="28" r="5.5" fill="#F59E0B" fill-opacity="0.85" />
    <circle cx="74" cy="28" r="5.5" fill="#10B981" fill-opacity="0.85" />

    <text x="98" y="32" class="mono" font-size="12" fill="#64748B" letter-spacing="0.5">aliakgun.site // engineering-deck // v2026</text>

    <!-- Live Status Pill -->
    <rect x="810" y="15" width="362" height="26" rx="13" fill="#091322" stroke="#1E293B" stroke-width="1" />
    <circle cx="828" cy="28" r="4.5" fill="#10B981" class="live-dot" />
    <text x="842" y="32" class="mono" font-size="11" font-weight="600" fill="#CBD5E1" letter-spacing="0.6">OPEN TO COLLABORATIONS • ANKARA, TR</text>

    <!-- Left Hero Section -->
    <!-- Eyebrow Badge -->
    <rect x="52" y="76" width="420" height="28" rx="14" fill="#0C192E" stroke="#0EA5E9" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="70" cy="90" r="4" fill="#38BDF8" />
    <text x="84" y="94" class="mono" font-size="11.5" font-weight="600" fill="#38BDF8" letter-spacing="0.9">SOFTWARE DEVELOPER &amp; PRODUCT BUILDER</text>

    <!-- Main Name -->
    <text x="52" y="160" class="sans" font-size="52" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1.2">Muhammed Ali Akgün</text>

    <!-- Subtitle -->
    <text x="52" y="198" class="sans" font-size="17.5" font-weight="400" fill="#94A3B8">Full-stack web platforms, high-performance desktop tools &amp; kernel-level software.</text>

    <!-- Interactive-Style Terminal Prompt Box -->
    <rect x="52" y="220" width="698" height="50" rx="12" fill="#040710" stroke="#1E293B" stroke-width="1.2" />
    <text x="72" y="250" class="mono" font-size="13.5">
      <tspan fill="#10B981" font-weight="700">➜</tspan>
      <tspan fill="#38BDF8" font-weight="600"> ~/aliakgun</tspan>
      <tspan fill="#64748B"> $ motto --print </tspan>
      <tspan fill="#F8FAFC" font-weight="600">"Think, design, make it work."</tspan>
    </text>
    <rect x="614" y="236" width="8" height="17" rx="1.5" fill="#38BDF8" class="cursor" />

    <!-- 4 Engineering Domain Chips -->
    <g transform="translate(52, 290)">
      <rect x="0" y="0" width="164" height="36" rx="10" fill="#0B1528" stroke="#0EA5E9" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="18" cy="18" r="4" fill="#38BDF8" />
      <text x="30" y="22" class="mono" font-size="11.5" font-weight="600" fill="#E2E8F0">Full-Stack Web</text>

      <rect x="176" y="0" width="174" height="36" rx="10" fill="#0B1528" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="194" cy="18" r="4" fill="#818CF8" />
      <text x="206" y="22" class="mono" font-size="11.5" font-weight="600" fill="#E2E8F0">.NET 10 &amp; Win32</text>

      <rect x="362" y="0" width="178" height="36" rx="10" fill="#0B1528" stroke="#F43F5E" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="380" cy="18" r="4" fill="#FB7185" />
      <text x="392" y="22" class="mono" font-size="11.5" font-weight="600" fill="#E2E8F0">Kernel &amp; Security</text>

      <rect x="552" y="0" width="146" height="36" rx="10" fill="#0B1528" stroke="#10B981" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="570" cy="18" r="4" fill="#34D399" />
      <text x="582" y="22" class="mono" font-size="11.5" font-weight="600" fill="#E2E8F0">Mobile &amp; Cloud</text>
    </g>

    <!-- Bottom Stack Telemetry Strip -->
    <text x="52" y="366" class="mono" font-size="12" fill="#64748B" letter-spacing="0.4">
      CORE // <tspan fill="#94A3B8">Laravel • React • Next.js • TypeScript • C# • C++ • Python • Java • Supabase</tspan>
    </text>

    <!-- Right HUD Panel: Orbital Architecture Radar -->
    <rect x="784" y="74" width="384" height="308" rx="18" fill="#050914" fill-opacity="0.88" stroke="#1E293B" stroke-width="1.2" />
    <text x="806" y="101" class="mono" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.8">SYSTEM TELEMETRY // FULL-SPECTRUM</text>
    <rect x="1096" y="87" width="52" height="19" rx="9.5" fill="#06281E" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
    <text x="1107" y="100" class="mono" font-size="10" font-weight="700" fill="#34D399">LIVE</text>
    <line x1="784" y1="114" x2="1168" y2="114" stroke="#1E293B" stroke-width="1" />

    <!-- Radar Center (976, 206) -->
    <!-- Crosshairs -->
    <line x1="884" y1="206" x2="1068" y2="206" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="976" y1="122" x2="976" y2="290" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Outer Rotating Ring -->
    <g>
      <circle cx="976" cy="206" r="74" fill="none" stroke="#1E3A8A" stroke-width="1.2" stroke-dasharray="10 6" />
      <animateTransform attributeName="transform" type="rotate" from="0 976 206" to="360 976 206" dur="26s" repeatCount="indefinite" />
    </g>

    <!-- Inner Counter-Rotating Ring -->
    <g>
      <circle cx="976" cy="206" r="48" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="6 5" />
      <animateTransform attributeName="transform" type="rotate" from="360 976 206" to="0 976 206" dur="16s" repeatCount="indefinite" />
    </g>

    <!-- Rotating Radar Sweep Wedge -->
    <g>
      <path d="M 976 206 L 976 132 A 74 74 0 0 1 1038 165 Z" fill="url(#radarSweep)" />
      <animateTransform attributeName="transform" type="rotate" from="0 976 206" to="360 976 206" dur="5.5s" repeatCount="indefinite" />
    </g>

    <!-- Expanding Sonar Pulse -->
    <circle cx="976" cy="206" r="8" fill="none" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="r" from="8" to="74" dur="3.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.75" to="0" dur="3.4s" repeatCount="indefinite" />
    </circle>

    <!-- Core Node -->
    <circle cx="976" cy="206" r="18" fill="#0B192E" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="976" cy="206" r="5" fill="#38BDF8" />

    <!-- 4 Satellite Nodes -->
    <circle cx="976" cy="132" r="5" fill="#38BDF8" />
    <text x="976" y="123" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#38BDF8">WEB</text>

    <circle cx="1050" cy="206" r="5" fill="#818CF8" />
    <text x="1062" y="210" class="mono" font-size="10" font-weight="700" fill="#818CF8">WIN32/.NET</text>

    <circle cx="976" cy="280" r="5" fill="#FB7185" />
    <text x="976" y="296" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FB7185">KERNEL</text>

    <circle cx="902" cy="206" r="5" fill="#34D399" />
    <text x="890" y="210" text-anchor="end" class="mono" font-size="10" font-weight="700" fill="#34D399">MOBILE</text>

    <!-- Bottom HUD Stats Row -->
    <line x1="784" y1="318" x2="1168" y2="318" stroke="#1E293B" stroke-width="1" />

    <text x="848" y="343" text-anchor="middle" class="sans" font-size="18" font-weight="800" fill="#F8FAFC">100%</text>
    <text x="848" y="362" text-anchor="middle" class="mono" font-size="10" fill="#64748B">ORIGINAL CODE</text>

    <line x1="912" y1="326" x2="912" y2="372" stroke="#1E293B" stroke-width="1" />

    <text x="976" y="343" text-anchor="middle" class="sans" font-size="18" font-weight="800" fill="#38BDF8">4 LAYERS</text>
    <text x="976" y="362" text-anchor="middle" class="mono" font-size="10" fill="#64748B">UI TO KERNEL</text>

    <line x1="1040" y1="326" x2="1040" y2="372" stroke="#1E293B" stroke-width="1" />

    <text x="1104" y="343" text-anchor="middle" class="sans" font-size="18" font-weight="800" fill="#34D399">v1.0+</text>
    <text x="1104" y="362" text-anchor="middle" class="mono" font-size="10" fill="#64748B">SHIPPED BUILDS</text>
  </g>

  <!-- Crisp Specular Border -->
  <rect x="4" y="4" width="1192" height="402" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
